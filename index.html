<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

    <title>نظام الحضور والانصراف</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                var(--tg-theme-bg-color, #ffffff);

            color:
                var(--tg-theme-text-color, #000000);

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        #welcome {
            margin: 0 0 18px;
            font-size: 24px;
            font-weight: 700;
        }

        .description {
            margin: 0 0 24px;

            font-size: 16px;
            line-height: 1.8;

            color:
                var(--tg-theme-hint-color, #666666);
        }

        .btn {
            width: 100%;

            min-height: 50px;

            margin: 8px 0;
            padding: 13px 16px;

            border: none;
            border-radius: 10px;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            background:
                var(--tg-theme-button-color, #2481cc);

            color:
                var(--tg-theme-button-text-color, #ffffff);

            transition: opacity 0.15s ease;
        }

        .btn:active {
            opacity: 0.75;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .btn-checkout {
            background: #d9534f;
        }

        #spinner {
            display: none;

            width: 28px;
            height: 28px;

            margin: 18px auto 0;

            border: 3px solid rgba(0, 0, 0, 0.12);

            border-radius: 50%;

            border-top-color:
                var(--tg-theme-button-color, #2481cc);

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #status {
            min-height: 25px;

            margin-top: 18px;

            font-size: 14px;
            line-height: 1.7;
        }

        .success {
            color: #188038;
        }

        .error {
            color: #d93025;
        }

        .info {
            color:
                var(--tg-theme-hint-color, #666666);
        }
    </style>
</head>

<body>

<div class="container">

    <h2 id="welcome">
        أهلاً بك
    </h2>

    <p class="description">
        اختر نوع العملية لتسجيل حضورك أو انصرافك
        بمشاركة موقعك الحالي:
    </p>

    <button
        id="checkinBtn"
        class="btn"
        type="button"
        onclick="submitAttendance('حضور')">

        تسجيل حضور

    </button>

    <button
        id="checkoutBtn"
        class="btn btn-checkout"
        type="button"
        onclick="submitAttendance('انصراف')">

        تسجيل انصراف

    </button>

    <div id="spinner"></div>

    <div id="status"></div>

</div>


<script>

    // ============================================================
    // CONFIG
    // ============================================================

    const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbw2GV7CNsdoeaoCMQnKs1Oe72Kkb_B0lwxRlUZi4wfXfwzukrHifa-dL3kDj8L7fPJtow/exec";


    // ============================================================
    // TELEGRAM
    // ============================================================

    const tg =
        window.Telegram &&
        window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;


    let submitting = false;


    // ============================================================
    // UI HELPERS
    // ============================================================

    function setStatus(message, type) {

        const status =
            document.getElementById("status");

        status.innerText = message;

        status.className = "";

        if (type) {
            status.classList.add(type);
        }
    }


    function setLoading(loading) {

        submitting = loading;

        document.getElementById("spinner")
            .style.display =
                loading ? "block" : "none";

        document.getElementById("checkinBtn")
            .disabled = loading;

        document.getElementById("checkoutBtn")
            .disabled = loading;
    }


    // ============================================================
    // TELEGRAM INITIALIZATION
    // ============================================================

    function initializeTelegram() {

        if (!tg) {

            setStatus(
                "❌ يجب فتح النظام من داخل تيليجرام.",
                "error"
            );

            return false;
        }


        try {

            tg.ready();

            tg.expand();


            /*
             * IMPORTANT:
             *
             * initData is the raw Telegram authorization data.
             *
             * This is what the server will validate.
             */

            console.log(
                "Telegram WebApp:",
                tg
            );

            console.log(
                "Telegram initData:",
                tg.initData
            );


            /*
             * Do NOT use initDataUnsafe as authentication.
             *
             * It is only used here for displaying the name.
             */

            const user =
                tg.initDataUnsafe &&
                tg.initDataUnsafe.user
                    ? tg.initDataUnsafe.user
                    : null;


            if (user && user.first_name) {

                document.getElementById("welcome")
                    .innerText =
                        `أهلاً، ${user.first_name}`;
            }


            /*
             * The important check is initData.
             */

            if (!tg.initData) {

                console.error(
                    "Telegram initData is empty."
                );

                setStatus(
                    "❌ لم يتم استلام بيانات التحقق من تيليجرام.",
                    "error"
                );

                return false;
            }


            return true;

        } catch (error) {

            console.error(
                "Telegram initialization error:",
                error
            );

            setStatus(
                "❌ حدث خطأ أثناء تشغيل النظام.",
                "error"
            );

            return false;
        }
    }


    // ============================================================
    // ATTENDANCE
    // ============================================================

    function submitAttendance(action) {

        if (submitting) {
            return;
        }


        if (!tg) {

            setStatus(
                "❌ يجب فتح النظام من داخل تيليجرام.",
                "error"
            );

            return;
        }


        /*
         * THIS is the authentication value.
         *
         * Never send a user ID supplied independently by the
         * browser as the trusted identity.
         */

        const initData = tg.initData;


        if (!initData) {

            setStatus(
                "❌ بيانات تيليجرام غير متوفرة.",
                "error"
            );

            return;
        }


        if (
            action !== "حضور" &&
            action !== "انصراف"
        ) {

            setStatus(
                "❌ عملية غير صحيحة.",
                "error"
            );

            return;
        }


        if (!navigator.geolocation) {

            setStatus(
                "❌ هذا الجهاز لا يدعم تحديد الموقع.",
                "error"
            );

            return;
        }


        setLoading(true);

        setStatus(
            "جاري تحديد موقعك الحالي...",
            "info"
        );


        navigator.geolocation.getCurrentPosition(

            function(position) {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                console.log(
                    "GPS:",
                    {
                        latitude,
                        longitude,
                        accuracy
                    }
                );


                setStatus(
                    "جاري حفظ وتأكيد العملية...",
                    "info"
                );


                /*
                 * Only send:
                 *
                 * 1. Telegram's signed initData
                 * 2. attendance action
                 * 3. GPS coordinates
                 *
                 * The server obtains the user's identity
                 * from validated initData.
                 */

                const payload = {

                    initData: initData,

                    action: action,

                    latitude: latitude,

                    longitude: longitude,

                    accuracy: accuracy
                };


                console.log(
                    "Sending attendance request."
                );


                fetch(
                    APPS_SCRIPT_URL,
                    {
                        method: "POST",

                        /*
                         * text/plain avoids the CORS preflight
                         * that application/json can cause.
                         */

                        headers: {
                            "Content-Type":
                                "text/plain;charset=UTF-8"
                        },

                        body:
                            JSON.stringify(payload)
                    }
                )

                .then(function(response) {

                    if (!response.ok) {

                        throw new Error(
                            "HTTP " +
                            response.status
                        );
                    }

                    return response.text();
                })

                .then(function(text) {

                    console.log(
                        "Server response:",
                        text
                    );


                    let result;

                    try {

                        result =
                            JSON.parse(text);

                    } catch (error) {

                        throw new Error(
                            "Invalid server response."
                        );
                    }


                    setLoading(false);


                    if (result.success) {

                        setStatus(
                            result.message ||
                            "✅ تم تسجيل العملية بنجاح.",
                            "success"
                        );


                        setTimeout(
                            function() {

                                if (
                                    tg &&
                                    typeof tg.close === "function"
                                ) {

                                    tg.close();
                                }

                            },
                            2000
                        );

                    } else {

                        setStatus(
                            "❌ " +
                            (
                                result.error ||
                                "حدث خطأ غير معروف."
                            ),
                            "error"
                        );
                    }

                })

                .catch(function(error) {

                    console.error(
                        "Attendance request error:",
                        error
                    );


                    setLoading(false);


                    setStatus(
                        "❌ حدث خطأ أثناء الاتصال بالخادم.",
                        "error"
                    );
                });
            },


            function(error) {

                setLoading(false);


                console.error(
                    "GPS error:",
                    error
                );


                let message =
                    "❌ تعذر الحصول على موقعك.";


                if (
                    error.code ===
                    error.PERMISSION_DENIED
                ) {

                    message =
                        "❌ تم رفض صلاحية الموقع. يرجى السماح لتيليجرام بالوصول إلى موقعك.";

                } else if (
                    error.code ===
                    error.POSITION_UNAVAILABLE
                ) {

                    message =
                        "❌ تعذر تحديد موقعك حالياً. تأكد من تشغيل GPS.";

                } else if (
                    error.code ===
                    error.TIMEOUT
                ) {

                    message =
                        "❌ انتهت مهلة تحديد الموقع. حاول مرة أخرى.";
                }


                setStatus(
                    message,
                    "error"
                );
            },


            {
                enableHighAccuracy: true,

                timeout: 15000,

                maximumAge: 0
            }
        );
    }


    // ============================================================
    // START
    // ============================================================

    initializeTelegram();

</script>

</body>
</html>
